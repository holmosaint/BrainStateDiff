name: TVSD
model_name: diffusion
dataset_params:
  im_path: ${TVSD_DATA}
  im_channels: 3
  im_size: 256
  name: TVSD
  timeseries_h5_path: ${TVSD_DATA}/ventral_stream_timeseries_preprocessed_no_baseline_nb30.h5
temporal_params:
  total_duration_ms: 300
  response_bins_ms:
  - 150
  - 250
diffusion_params:
  num_timesteps: 1000
  beta_start: 0.00085
  beta_end: 0.012
ldm_params:
  down_channels:
  - 256
  - 384
  - 512
  - 768
  mid_channels:
  - 768
  - 512
  down_sample:
  - true
  - true
  - true
  attn_down:
  - true
  - true
  - true
  time_emb_dim: 512
  norm_channels: 32
  num_heads: 16
  conv_out_channels: 128
  num_down_layers: 2
  num_mid_layers: 2
  num_up_layers: 2
  use_bottleneck: false
  bottleneck_dim: 50
  condition_config:
    condition_types:
    - neural
    neural_condition_config:
      neural_embed_dim: 315
      cond_drop_prob: 0.1
autoencoder_params:
  z_channels: 4
  codebook_size: 8192
  down_channels:
  - 64
  - 128
  - 256
  - 256
  mid_channels:
  - 256
  - 256
  down_sample:
  - true
  - true
  - true
  attn_down:
  - false
  - false
  - false
  norm_channels: 32
  num_heads: 4
  num_down_layers: 2
  num_mid_layers: 2
  num_up_layers: 2
train_params:
  ldm_batch_size: 8
  ldm_epochs: 100
  ldm_lr: 5.0e-06
  reconstruction_seed: 42
  num_workers: 1
  save_every: 5
